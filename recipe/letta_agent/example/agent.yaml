# Agent loop configuration for Letta React Agent Loop
# This should be a list of agent loop configurations
- name: "letta_react_agent"
  _target_: recipe.letta_agent.react_agent_loop.ReactAgentLoop
  tools: ["search_web", "calculator"]
  
# Example tool configuration (this would be in a separate tool config file)
# tools:
#   - name: "search_web"
#     description: "Search the web for information"
#   - name: "calculator"
#     description: "Perform mathematical calculations"

# Letta-specific configuration (this would be in the main config)
# For Letta Cloud (recommended):
# letta:
#   api_key: "your_letta_api_key_here"
#   base_url: "https://api.letta.com"  # Optional, defaults to Letta Cloud

# For self-hosted Letta server:
# letta:
#   base_url: "http://localhost:8283"
#   # No api_key needed for self-hosted unless password protection is enabled

# Agent configuration will be automatically created with:
# - Memory blocks: persona and human
# - Tools: converted from LangChain tools to Letta format
# - Model: derived from actor_rollout_ref.model.path
# - Embedding: openai/text-embedding-3-small
